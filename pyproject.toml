[project]
name = "mksz-roster"
version = "0.1.0"
description = "Download handball match rosters (numbers, names, goalkeepers) from the MKSZ livescore site"
requires-python = ">=3.10"
dependencies = ["playwright>=1.47", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mksz-roster = "mksz_roster.scrape:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mksz_roster"]
